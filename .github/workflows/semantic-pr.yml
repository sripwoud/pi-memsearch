name: semantic-pr

on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title against conventional commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          requireScope: false
          # lowercase subject, >= 3 chars: mirrors .convco description.length.min
          subjectPattern: ^(?![A-Z]).{3,}$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}" must start with a lowercase letter and be at least 3 characters long.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
